<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contoso Task Pane Add-in</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- Fluent UI -->
    <link rel="stylesheet"
        href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css" />

    <!-- Estilos -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">

    <header class="ms-welcome__header ms-bgColor-neutralLighter">
        <img width="90" height="90" src="../../assets/logo-filled.png" alt="Contoso" title="Contoso" />
        <h1 class="ms-font-su">Welcome</h1>
    </header>

    <section id="sideload-msg" class="ms-welcome__main">
        <h2 class="ms-font-xl">
            Please
            <a target="_blank"
                href="https://learn.microsoft.com/office/dev/add-ins/testing/test-debug-office-add-ins#sideload-an-office-add-in-for-testing">
                sideload
            </a>
            your add-in to see app body.
        </h2>
    </section>

    <main id="app-body" class="ms-welcome__main" style="display: none;">

        <h2 class="ms-font-xl">Discover what Office Add-ins can do for you today!</h2>

        <ul class="ms-List ms-welcome__features">
            <li class="ms-ListItem">
                <i class="ms-Icon ms-Icon--Ribbon ms-font-xl"></i>
                <span class="ms-font-m">Achieve more with Office integration</span>
            </li>
            <li class="ms-ListItem">
                <i class="ms-Icon ms-Icon--Unlock ms-font-xl"></i>
                <span class="ms-font-m">Unlock features and functionality</span>
            </li>
            <li class="ms-ListItem">
                <i class="ms-Icon ms-Icon--Design ms-font-xl"></i>
                <span class="ms-font-m">Create and visualize like a pro</span>
            </li>
        </ul>

        <p class="ms-font-l">
            Modify the source files, then click <b>Run</b>.
        </p>

        <!-- BOTÓN -->
        <button id="btnCarga"
            class="ms-welcome__action ms-Button ms-Button--hero ms-font-xl">
            <span class="ms-Button-label">Carga XML / PDF</span>
        </button>

        <p>
            <label id="item-subject"></label>
        </p>

    </main>

    <!-- ✅ MODAL DE ERROR -->
    <div id="modalError" style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.5);
        justify-content:center;
        align-items:center;
        z-index:1000;
    ">

        <div style="
            background:white;
            padding:20px;
            border-radius:10px;
            text-align:center;
            width:80%;
            max-width:320px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.2);
        ">

            <p id="modalMensaje" style="margin-bottom:15px; font-size:14px;"></p>

            <button id="btnCerrarModal"
                class="ms-Button ms-Button--primary">
                <span class="ms-Button-label">Cerrar</span>
            </button>

        </div>

    </div>

</body>

</html>
